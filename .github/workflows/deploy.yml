name: Deploy site

# Builds the manual (docs/) and publishes it under /docs/ next to the
# hand-baked marketing pages at the repo root. Requires the repository's
# Pages source to be "GitHub Actions" (Settings ▸ Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build the manual
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble the site
        # The static pages at the repo root are served as they are; the built
        # manual lands under /docs/. Project sources and repo metadata are
        # not published.
        run: |
          mkdir -p _site/docs
          rsync -a ./ _site/ \
            --exclude /.git --exclude /.github --exclude /docs --exclude /_site \
            --exclude /design-v2 --exclude /CLAUDE.md --exclude /README.md \
            --exclude /run.sh --exclude /mark.md --exclude .DS_Store
          rsync -a docs/dist/ _site/docs/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
